name: sanitized

# Enforce the public/private boundary: this repo must never name a specific machine, host,
# operator, private IP, or project/product. The real, tactical, machine-specific material lives
# in the private conductor-bs repo. See tools/check_sanitized.py for the rule and the rationale.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject machine/project-specific leaks
        run: python3 tools/check_sanitized.py
      # The same boundary, one axis over: check_sanitized.py rejects machine/host/project
      # identifiers, and the operator's GIVEN NAME is not in its catalogue -- which is how 122
      # occurrences across 42 of 151 tracked files sat in this PUBLIC repo with CI green until
      # 2026-08-11. This repo has no .pre-commit-config.yaml, so CI is the only place to gate it.
      # The checker's own suite is picked up separately by tool-tests.yml (it globs
      # tools/*_test.py), and that suite carries the positive control -- gutting check_generic.py
      # leaves THIS step green, so the two jobs are load-bearing together, not individually.
      - name: Require generic phrasing (no personal name)
        run: python3 tools/check_generic.py
